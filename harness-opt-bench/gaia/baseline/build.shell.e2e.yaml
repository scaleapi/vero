name: vero/optimize-gaia-shell-e2e
description: >-
  The program must answer canonical GAIA tasks: general-knowledge questions that
  may need research, computation, or inspection of attached files. How it does
  that is yours to decide -- the approach, what the agent can do, how it uses its
  environment, how many model calls it takes, and when it stops. Preserve the
  Harbor agent interface and the class import path. The grader reads the exact
  answer from /app/answer.txt.
instruction_template: instruction.shell.md.j2
agent_repo: target-shell
task_source: gaia/gaia@sha256:bbc356f476e0b70ba77da11a9be7d6345918d1e4a2daade0d6dfb82ee6f7b761
task_manifest: ../partitions/manifest.json
agent_import_path: gaia_agent.agent:GaiaAgent
# Include the extra your evaluation environment needs.
harbor_requirement: ${harbor_requirement:-harbor[modal]==0.20.0}

# E2E SMOKE VARIANT of build.shell.yaml. Same seed, same target, same gateway
# scopes; eight cases in total, tiny budgets, and a 25-minute agent clock so the
# run reaches finalization quickly. It exists to prove the trial machinery end to
# end (compile, tokens, evaluations, agent timeout -> verifier, session archive)
# after a change to vero, not to measure anything. Never report its score.
partition_files:
  development: ../partitions-e2e/development.json
  validation: ../partitions-e2e/validation.json
  test: ../partitions-e2e/test.json

agent_access:
  - partition: development
    disclosure: full
    expose_case_resources: true
    total_runs: 6
    total_cases: 12
  - partition: validation
    disclosure: aggregate
    expose_case_resources: false
    min_aggregate_cases: 1
    total_runs: 6
    total_cases: 18

selection_partition: validation
targets:
  - partition: test
    reward_key: reward
    # Zero by construction, not by measurement: the skeleton writes an empty
    # answer, so every case is scored and wrong. Confirm with one baseline round
    # before quoting deltas -- the number is a claim about the seed, not a
    # measurement of it.
    baseline_reward: 0.0
    failure_value: 0.0
    max_attempts: 1
    # Match the three-round procedure used to estimate the pinned baseline.
    n_attempts: 3
    aggregate_attempts: mean

evaluation_set_name: gaia
objective:
  selector:
    metric: score
  direction: maximize
reward_mode: submit  # agent picks; falls back to auto_best, then current version
baseline_floor: false  # gates on validation while reward is on test; opt-in only
score_baseline: false
rescore_top_k: 1
rescore_attempts: 1

# GAIA includes image inputs, so the target must be multimodal. Keep this name
# aligned with the exact value sent by the agent.
model: gpt-5.4-mini
environment_name: ${inner_env:?set inner_env to a Harbor environment}
# Group evaluation sandboxes under one app and reclaim idle ones; drop these
# for an environment that does not accept them.
extra_harbor_args: ["--ek", "app_name=harness-opt-bench", "--ek", "sandbox_idle_timeout_secs=3600"]
harbor_python_version: "3.12"
n_attempts: 1
# Retry transient request failures during an evaluation. Whole-evaluation
# retries remain limited to trusted final scoring.
max_retries: 4
retry_max_wait_seconds: 120
infrastructure_max_attempts: 3
infrastructure_retry_delay_seconds: 5
aggregate_attempts: best
feedback_transcripts: true
feedback_max_bytes: 16000
expose_attempt_detail: false
# This smoke variant intentionally uses shorter overall limits.
timeout_seconds: 1800
case_timeout_seconds: 600
task_agent_timeout_seconds: 600
max_concurrency: 24
error_rate_threshold: 0.1
verifier_timeout_seconds: 3600
# Limits on the outer optimizer trial. The agent timeout leaves time for final
# scoring before the hard sandbox deadline.
optimizer_sandbox_timeout_seconds: 14400
optimizer_sandbox_idle_timeout_seconds: 1800
# 25 minutes: long enough for the optimizer to run a few evaluations, short
# enough that Harbor stops it and hands over to the verifier within the hour,
# which is the path this variant exists to exercise.
optimizer_agent_timeout_seconds: 1500
optimizer_allow_internet: true

# Credentials your execution and telemetry services need. Edit to match your
# deployment; each name must be set in the env file.
secrets:
  - MODAL_TOKEN_ID
  - MODAL_TOKEN_SECRET
  - MODAL_ENVIRONMENT
  - WANDB_API_KEY
  - WANDB_BASE_URL

# Telemetry (optional). Remove this block to run without it.
wandb:
  project: harness-engineering-bench
  group: gaia
  name: ${wandb_run:-gaia-shell-e2e}
  tags: [gaia, shell-seed, e2e-smoke]
  log_traces: true

# Keep the candidate isolated from held-out state.
harness_user: harness
# Allow one full evaluation to complete in a foreground tool call.
agent_env:
  BASH_MAX_TIMEOUT_MS: "3600000"
  BASH_DEFAULT_TIMEOUT_MS: "3600000"
  ENABLE_BACKGROUND_TASKS: "0"
  FORCE_AUTO_BACKGROUND_TASKS: "0"
  UV_TOOL_BIN_DIR: "/home/agent/.local/bin"


inference_gateway:
  upstream_api_key_env: OPENAI_API_KEY
  upstream_base_url_env: OPENAI_BASE_URL
  # Enables reliable per-trial usage attribution.
  request_log_attribution: true
  producer:
    allowed_models: ["${optimizer_model:-gpt-5.4}"]
    max_concurrency: 8
  # Case budgets control normal use; token caps stop runaway requests.
  evaluation:
    allowed_models: [gpt-5.4-mini]
    max_requests: 200000
    max_tokens: 200000000  # 30 agent case-runs at most
    max_concurrency: 64
  # Reserved so a search-phase overspend can never starve held-out scoring.
  finalization:
    allowed_models: [gpt-5.4-mini]
    max_requests: 200000
    max_tokens: 2000000000  # 66 test cases x3 attempts + rescore headroom
    max_concurrency: 64
instruct_multifidelity: true
instruct_exhaust_budget: true
