name: vero/optimize-tau3-baseline
description: >-
  Improve a customer-service agent on canonical tau3-bench tasks while
  preserving the task-owned MCP protocol and evaluation.
agent_repo: target
task_source: sierra-research/tau3-bench@sha256:a57304f682894ac061090769af771a3617664f3ff6e5417d4eadf8e30433e4d9
task_manifest: ../partitions/manifest.json
agent_import_path: tau3_agent.agent:Tau3Agent
harbor_requirement: harbor==0.20.0

partition_files:
  development: ../partitions/development.json
  validation: ../partitions/validation.json
  test: ../partitions/test.json

agent_access:
  - partition: development
    disclosure: full
    expose_case_resources: true
    total_runs: 100
    total_cases: 300
  - partition: validation
    disclosure: aggregate
    expose_case_resources: false
    min_aggregate_cases: 5
    total_runs: 100
    total_cases: 600

selection_partition: validation
targets:
  - partition: test
    reward_key: reward
    baseline_reward: 0.7321  # re-pinned 0.738 / 0.740 / 0.718 (sd 0.0099); was 0.6111. See runs/BASELINES.md
    failure_value: 0.0
    max_attempts: 1
    # The held-out eval is noisy: score the selected candidate 3x per case and
    # average, so the final reward is comparable to the pinned baseline, which was
    # itself pooled over 3 rounds. Without this the candidate carries ~sqrt(3) more
    # standard error than the floor it is judged against.
    # Per-target override - search/validation keep the global n_attempts (1).
    n_attempts: 3
    aggregate_attempts: mean

evaluation_set_name: tau3
objective:
  selector:
    metric: score
  direction: maximize
reward_mode: submit  # agent picks; falls back to auto_best, then current version
baseline_floor: false  # gates on validation while reward is on test; opt-in only
score_baseline: false
rescore_top_k: 3
rescore_attempts: 1

model: deepseek-v4-flash
environment_name: ${inner_env:?set inner_env to a Harbor environment}
extra_harbor_args: ["--ek", "app_name=harness-opt-bench", "--ek", "sandbox_idle_timeout_secs=3600"]
harbor_python_version: "3.12"
n_attempts: 1
max_retries: 1
infrastructure_max_attempts: 3
infrastructure_retry_delay_seconds: 5
aggregate_attempts: best
feedback_transcripts: true
feedback_max_bytes: 16000
expose_attempt_detail: false
# Unreachable: worst case is ceil(450/24) x 3600 = 68400s, every
# finalize trial (150 held-out x n_attempts=3) hitting its own cap. Assumes
# max_concurrency=24; recompute if that drops.
timeout_seconds: 79200
# Exactly the dataset's declared [agent] timeout_sec, so vero's derived
# --agent-timeout-multiplier is 1.0 and the target agent gets precisely the
# clock the benchmark intends. Harbor times agent setup, environment build and
# verification on separate clocks with separate multipliers, so none of them
# eat into this budget and no buffer is warranted.
case_timeout_seconds: 3600
task_agent_timeout_seconds: 3600
max_concurrency: 24  # 8 -> 24; see officeqa for the measured headroom argument
error_rate_threshold: 0.1
# Unreachable: worst-case finalize (68400) + worst-case rescore_top_k=3
# validation rescore (68400). A verifier timeout loses the score outright.
verifier_timeout_seconds: 158400
# Limits on the outer optimizer trial. The agent timeout leaves time for final
# scoring before the hard sandbox deadline.
optimizer_sandbox_timeout_seconds: 86400
optimizer_sandbox_idle_timeout_seconds: 3600
optimizer_agent_timeout_seconds: 72000
optimizer_allow_internet: true

inference_gateway:
  upstream_api_key_env: OPENAI_API_KEY
  upstream_base_url_env: OPENAI_BASE_URL
  # Stamp request-log records with a thread_id so per_trial_tokens.py can attribute
  # gateway token usage to individual trials (trusted, vs. content-matching).
  # Without it the fallback recovers only each conversation's root turn: measured
  # 0-13% coverage unstamped against 90-98% stamped, even with --tasks-dir.
  request_log_attribution: true
  producer:
    allowed_models: ["${optimizer_model:-gpt-5.4}"]
    max_concurrency: 8
  # See officeqa/baseline/build.yaml for the sizing rationale: the case budget is
  # the spend control, so a token cap only needs to stop a runaway. tau3 is the
  # largest set here, hence the bigger ceiling.
  evaluation:
    allowed_models: [deepseek-v4-flash]
    model_aliases:
      deepseek-v4-flash: ${target_model_route:-fireworks_ai/deepseek-v4-flash-0731}
    max_requests: 200000
    max_tokens: 4000000000  # 900 agent case-runs (300 dev + 600 validation)
    max_concurrency: 64
  # Reserved so a search-phase overspend can never starve held-out scoring.
  finalization:
    allowed_models: [deepseek-v4-flash]
    model_aliases:
      deepseek-v4-flash: ${target_model_route:-fireworks_ai/deepseek-v4-flash-0731}
    max_requests: 200000
    max_tokens: 4000000000  # 150 test cases x3 attempts + rescore headroom
    max_concurrency: 64
instruct_multifidelity: true
instruct_exhaust_budget: true

# tau3's environment runs its own LLM services — the user-simulator (inside the
# task container) and the NL-assertions grader (verifier) — which cannot reach the
# compose-internal inference gateway. Give them the real upstream directly while
# the candidate agent keeps the metered/allow-listed gateway (VERO_AGENT_INFERENCE_*).
task_services_use_upstream: true
# Harness isolation is off for tau3: its task-owned services need the real
# upstream credential, which uid isolation cannot hide from the harness env.
# Re-enable once task-service credentials are delivered off the harness env.
harness_user: null
# Allow one full evaluation to complete in a foreground tool call.
agent_env:
  BASH_MAX_TIMEOUT_MS: "32400000"
  BASH_DEFAULT_TIMEOUT_MS: "32400000"
  ENABLE_BACKGROUND_TASKS: "0"
  FORCE_AUTO_BACKGROUND_TASKS: "0"
  UV_TOOL_BIN_DIR: "/home/agent/.local/bin"

task_environment:
  TAU2_USER_MODEL: gpt-5.4-mini-2026-03-17
  TAU2_NL_ASSERTIONS_MODEL: gpt-5.4-mini-2026-03-17
