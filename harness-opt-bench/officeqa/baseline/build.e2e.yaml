# Field meanings and the shared rules are in ../../CONFIGURATION.md; comments here
# cover only what is specific to this benchmark.
name: vero/optimize-officeqa-e2e
description: >-
  Improve a grounded-reasoning agent on OfficeQA (Treasury Bulletin corpus QA).
  The agent must search /app/corpus/ and write the exact answer to /app/answer.txt;
  scoring is rule-based (numeric/text match with 1% tolerance).
# The task source is vendored locally and uses a prebuilt corpus image.
agent_repo: target
task_source: ../tasks
task_manifest: ../partitions/manifest.json
agent_import_path: officeqa_agent.agent:OfficeQaAgent
harbor_requirement: ${harbor_requirement:-harbor[modal]==0.20.0}
vero_requirement: scaleapi-vero==0.6.0

# E2E SMOKE VARIANT of build.yaml. Same seed, same target, same gateway scopes;
# eight cases in total, tiny budgets, and a 25-minute agent clock so the run
# reaches finalization quickly. It exists to prove the trial machinery end to end
# (compile, tokens, target route, evaluations, agent timeout -> verifier, session
# archive) after a change to vero or to the target deployment, not to measure
# anything. Never report its score.

partition_files:
  development: ../partitions-e2e/development.json
  validation: ../partitions-e2e/validation.json
  test: ../partitions-e2e/test.json

agent_access:
  - partition: development
    disclosure: full
    expose_case_resources: true
    total_runs: 6
    total_cases: 12
  - partition: validation
    disclosure: aggregate
    expose_case_resources: false
    min_aggregate_cases: 1
    total_runs: 6
    total_cases: 18

selection_partition: validation
targets:
  - partition: test
    reward_key: reward
    baseline_reward: 0.3412  # re-pinned 0.354 / 0.296 / 0.374 (sd 0.0330); was 0.3603. See runs/BASELINES.md
    failure_value: 0.0
    max_attempts: 1
    n_attempts: 3
    aggregate_attempts: mean

evaluation_set_name: officeqa
objective:
  selector:
    metric: score
  direction: maximize
reward_mode: submit  # agent picks; falls back to auto_best, then current version
baseline_floor: false  # gates on validation while reward is on test; opt-in only
score_baseline: false
rescore_top_k: 1
rescore_attempts: 1

model: deepseek-v4-flash
environment_name: ${inner_env:?set inner_env to a Harbor environment}
# Pull the prebuilt corpus image described above.
extra_harbor_args: ["--no-force-build", "--ek", "app_name=harness-opt-bench", "--ek", "sandbox_idle_timeout_secs=3600"]
harbor_python_version: "3.12"
n_attempts: 1
max_retries: 4
retry_max_wait_seconds: 120
infrastructure_max_attempts: 3
infrastructure_retry_delay_seconds: 5
aggregate_attempts: best
feedback_transcripts: true
feedback_max_bytes: 16000
expose_attempt_detail: false
# Nine trials at most per evaluation, one 1,800-second wave.
timeout_seconds: 3600
case_timeout_seconds: 1800
task_agent_timeout_seconds: 1800
max_concurrency: 24
error_rate_threshold: 0.1
verifier_timeout_seconds: 7200
optimizer_sandbox_timeout_seconds: 10800
optimizer_sandbox_idle_timeout_seconds: 3600
optimizer_agent_timeout_seconds: 1500
optimizer_allow_internet: true
optimizer_harness_versions:
  claude-code: 2.1.220
  codex: 0.146.0
  opencode: 1.18.9
  kimi-cli: 1.49.0
  goose: 1.45.0
  mini-swe-agent: 2.4.6

secrets:
  - MODAL_TOKEN_ID
  - MODAL_TOKEN_SECRET
  - MODAL_ENVIRONMENT
  - WANDB_API_KEY
  - WANDB_BASE_URL

wandb:
  project: harness-engineering-bench
  group: officeqa
  name: ${wandb_run:-officeqa-e2e}
  tags: [officeqa]
  log_traces: true

harness_user: harness

agent_env:
  BASH_MAX_TIMEOUT_MS: "10800000"
  BASH_DEFAULT_TIMEOUT_MS: "10800000"
  ENABLE_BACKGROUND_TASKS: "0"
  FORCE_AUTO_BACKGROUND_TASKS: "0"
  UV_TOOL_BIN_DIR: "/home/agent/.local/bin"

inference_gateway:
  upstream_api_key_env: OPENAI_API_KEY
  upstream_base_url_env: OPENAI_BASE_URL
  request_log_attribution: true
  producer:
    allowed_models: ["${optimizer_model:-gpt-5.4}"]
    max_concurrency: 8
  evaluation:
    allowed_models: [deepseek-v4-flash]
    model_aliases:
      deepseek-v4-flash: ${target_model_route:-azure_ai/DeepSeek-V4-Flash}
    max_requests: 200000
    max_tokens: 3000000000  # 588 agent case-runs (196 dev + 392 validation)
    max_concurrency: 64
  finalization:
    allowed_models: [deepseek-v4-flash]
    model_aliases:
      deepseek-v4-flash: ${target_model_route:-azure_ai/DeepSeek-V4-Flash}
    max_requests: 200000
    max_tokens: 3000000000  # 297 finalize trials (99 test x3) + 294 rescore
    max_concurrency: 64
