# Field meanings and the shared rules are in ../../CONFIGURATION.md; comments here
# cover only what is specific to this benchmark.
name: vero/optimize-browsecomp-plus-baseline
description: >-
  Improve a deep-research agent on BrowseComp-Plus using its fixed corpus,
  canonical BM25 index, and semantic answer evaluator.
agent_repo: target
task_source: ../tasks
task_manifest: ../partitions/manifest.json
agent_import_path: browsecomp_plus_agent.agent:BrowseCompPlusAgent
harbor_requirement: ${harbor_requirement:-harbor[modal]==0.20.0}

partition_files:
  development: ../partitions/development.json
  validation: ../partitions/validation.json
  test: ../partitions/test.json

agent_access:
  - partition: development
    disclosure: full
    expose_case_resources: true
    total_runs: 100
    total_cases: 132
  - partition: validation
    disclosure: aggregate
    expose_case_resources: false
    min_aggregate_cases: 5
    total_runs: 100
    total_cases: 264

selection_partition: validation
targets:
  - partition: test
    reward_key: reward
    baseline_reward: 0.4619  # re-pinned 0.424 / 0.470 / 0.492 (sd 0.0283); was 0.4495. See runs/BASELINES.md
    failure_value: 0.0
    max_attempts: 1
    n_attempts: 3
    aggregate_attempts: mean

evaluation_set_name: browsecomp-plus
objective:
  selector:
    metric: score
  direction: maximize
reward_mode: submit
baseline_floor: false
score_baseline: false
rescore_top_k: 3
rescore_attempts: 1

model: deepseek-v4-flash
environment_name: ${inner_env:?set inner_env to a Harbor environment}
extra_harbor_args: ["--ek", "app_name=harness-opt-bench", "--ek", "sandbox_idle_timeout_secs=3600"]
harbor_python_version: "3.12"
n_attempts: 1
max_retries: 4
retry_max_wait_seconds: 120
infrastructure_max_attempts: 3
infrastructure_retry_delay_seconds: 5
aggregate_attempts: best
feedback_transcripts: true
feedback_max_bytes: 16000
expose_attempt_detail: false
# Above the 32,400-second worst case at the configured concurrency.
timeout_seconds: 39600
case_timeout_seconds: 3600
task_agent_timeout_seconds: 3600
max_concurrency: 24
error_rate_threshold: 0.1
verifier_timeout_seconds: 75600
optimizer_sandbox_timeout_seconds: 86400
optimizer_sandbox_idle_timeout_seconds: 3600
optimizer_agent_timeout_seconds: 72000
optimizer_allow_internet: true

secrets:
  - MODAL_TOKEN_ID
  - MODAL_TOKEN_SECRET
  - MODAL_ENVIRONMENT
  - WANDB_API_KEY
  - WANDB_BASE_URL

wandb:
  project: harness-engineering-bench
  group: browsecomp-plus
  name: ${wandb_run:-browsecomp-plus}
  tags: [browsecomp-plus]
  log_traces: true

inference_gateway:
  upstream_api_key_env: OPENAI_API_KEY
  upstream_base_url_env: OPENAI_BASE_URL
  request_log_attribution: true
  producer:
    allowed_models: ["${optimizer_model:-gpt-5.4}"]
    max_concurrency: 8
  evaluation:
    allowed_models: [deepseek-v4-flash]
    model_aliases:
      deepseek-v4-flash: ${target_model_route:-fireworks_ai/deepseek-v4-flash-0731}
    max_requests: 200000
    max_tokens: 2000000000  # 396 agent case-runs (132 dev + 264 validation)
    max_concurrency: 64
  finalization:
    allowed_models: [deepseek-v4-flash]
    model_aliases:
      deepseek-v4-flash: ${target_model_route:-fireworks_ai/deepseek-v4-flash-0731}
    max_requests: 200000
    max_tokens: 2000000000  # 66 test cases x3 attempts + rescore headroom
    max_concurrency: 64

instruct_multifidelity: true
instruct_exhaust_budget: true

# The task-owned evaluator needs direct endpoint access; the editable target
# continues to receive only an evaluation-scoped gateway credential.
task_services_use_upstream: true
harness_user: null
agent_env:
  BASH_MAX_TIMEOUT_MS: "14400000"
  BASH_DEFAULT_TIMEOUT_MS: "14400000"
  ENABLE_BACKGROUND_TASKS: "0"
  FORCE_AUTO_BACKGROUND_TASKS: "0"
  UV_TOOL_BIN_DIR: "/home/agent/.local/bin"

task_environment:
  BROWSECOMP_JUDGE_MODEL: gpt-4.1
