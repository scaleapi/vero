[project]
name = "generic-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Scale OSS", email = "oss@scale.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai-agents[litellm]>=0.10",
    "scale-vero-tasks>=0.1.0",
    "sympy>=1.14.0",
    "tree-sitter>=0.25.2",
]

[project.scripts]
generic-agent = "generic_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-json-report>=1.5.0",
]

[tool.uv.sources]
scale-vero-tasks = { path = "../../../vero-tasks", editable = true }
