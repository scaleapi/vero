[project]
name = "pharma-summarizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Scale OSS", email = "oss@scale.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=2.7.2",
    "openai-agents>=0.5.0",
]

[project.scripts]
pharma-summarizer = "pharma_summarizer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
scale-vero = { path = "../../../vero", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-json-report>=1.5.0",
    "scale-vero",
]
