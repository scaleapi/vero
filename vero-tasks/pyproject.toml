[project]
name = "scale-vero-tasks"
version = "0.2.0"
description = "Narrow Python task protocol and runner for VeRO evaluations."
readme = "README.md"
authors = [
    { name = "Varun Ursekar", email = "oss@scale.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11.7",
]

[project.scripts]
vero-task = "vero_tasks.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vero_tasks"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
