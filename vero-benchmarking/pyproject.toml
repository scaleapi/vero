[project]
name = "vero-benchmarking"
version = "0.3.0"
description = "A self-contained library to benchmark Vero on open-source datasets"
readme = "README.md"
authors = [
    { name = "Varun Ursekar", email = "oss@scale.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.3.0",
    "gdown>=5.2.0",
    "kagglehub>=0.3.13",
    "pandas>=2.3.3",
    "scale-vero[claude,optimize]",
    "scale-vero-tasks>=0.1.0",
]

[project.scripts]
vero-benchmarking = "vero_benchmarking.runner:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
scale-vero = { path = "../vero", editable = true }
scale-vero-tasks = { path = "../vero-tasks", editable = true }

[tool.ruff]
ignore = ["F704", "E402"]
