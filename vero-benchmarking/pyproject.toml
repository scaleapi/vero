[project]
name = "vero-benchmarking"
version = "0.3.0"
description = "A self-contained library to benchmark Vero on open-source datasets"
readme = "README.md"
authors = [
    { name = "Varun Ursekar", email = "oss@scale.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.41.5",
    "gdown>=5.2.0",
    "jupyter>=1.1.1",
    "kagglehub>=0.3.13",
    "kaleido>=1.2.0",
    "matplotlib>=3.10.7",
    "plotly>=6.5.2",
    "retry2>=0.9.5",
    "scale-vero[claude,jupyter,optimize,sgp,wandb,docker]",
    "scale-vero-tasks>=0.1.0",
    "tiktoken>=0.12.0",
    "umap-learn>=0.5.11",
]

[project.scripts]
vero-benchmarking = "vero_benchmarking.runner:main"

[project.optional-dependencies]
gepa = [
    "gepa>=0.0.22",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
scale-vero = { path = "../vero", editable = true }
scale-vero-tasks = { path = "../vero-tasks", editable = true }

[tool.ruff]
ignore = ["F704", "E402"]
