name: publish

# Build the `scaleapi-vero` distribution from vero/ and upload it to PyPI.
#
# Runs when a GitHub release is published, or by hand. Publishing uses PyPI's
# trusted publishing (OIDC): no API token is stored anywhere in this repository.
# One-time setup on pypi.org, project `scaleapi-vero` -> Publishing -> add a
# GitHub publisher with owner `scaleapi`, repository `vero`, workflow
# `publish.yml`, environment `pypi`. Until that is done the publish job fails
# with "invalid-publisher", which is the expected state on a fresh project.
#
# The distribution name differs from the import name on purpose: `scale-vero` is
# squatted on PyPI by an unrelated placeholder, so the package installs as
# `scaleapi-vero` and imports as `vero`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the release tag matches the package version
        # A release tag `vX.Y.Z` must name the version in pyproject.toml, or the
        # upload either fails (version exists) or publishes under the wrong name.
        # Manual runs have no tag and skip the check.
        if: github.event_name == 'release'
        working-directory: vero
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }

      - name: Build sdist and wheel
        working-directory: vero
        run: uv build

      - name: Confirm the built distribution is scaleapi-vero
        working-directory: vero
        run: ls dist/ && ls dist/ | grep -q '^scaleapi_vero-'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: vero/dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
