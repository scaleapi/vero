[project]
name = "vero-tau3-agent"
version = "0.1.0"
description = "Editable Harbor-native tau3 baseline for VeRO"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau3_agent"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
