name: vero/optimize-tau3-baseline
description: >-
  Improve a customer-service agent on canonical tau3-bench tasks while
  preserving the task-owned MCP protocol and evaluation.
agent_repo: target
task_source: sierra-research/tau3-bench@sha256:a57304f682894ac061090769af771a3617664f3ff6e5417d4eadf8e30433e4d9
task_manifest: ../partitions/manifest.json
agent_import_path: tau3_agent.agent:Tau3Agent
harbor_requirement: harbor[modal]==0.20.0

partition_files:
  development: ../partitions/development.json
  validation: ../partitions/validation.json
  test: ../partitions/test.json

agent_access:
  - partition: development
    disclosure: full
    expose_case_resources: true
    total_runs: 100
    total_cases: 300
  - partition: validation
    disclosure: aggregate
    expose_case_resources: false
    min_aggregate_cases: 5
    total_runs: 100
    total_cases: 600

selection_partition: validation
targets:
  - partition: test
    reward_key: reward
    baseline_reward: 0.6111  # held-out K=3 mean (see CONFIGURATION.md)
    failure_value: 0.0
    max_attempts: 1

evaluation_set_name: tau3
objective:
  selector:
    metric: score
  direction: maximize
reward_mode: submit  # agent picks; falls back to auto_best, then current version
baseline_floor: false  # gates on validation while reward is on test; opt-in only
score_baseline: false
rescore_top_k: 3
rescore_attempts: 1

model: fireworks_ai/deepseek-v4-flash
environment_name: ${inner_env:-modal}
# inner eval sandboxes share a dedicated Modal app instead of the __harbor__ default
extra_harbor_args: ["--ek", "app_name=harness-engineering-bench", "--ek", "sandbox_idle_timeout_secs=3600"]
harbor_python_version: "3.12"
n_attempts: 1
max_retries: 1
infrastructure_max_attempts: 3
infrastructure_retry_delay_seconds: 5
aggregate_attempts: best
feedback_transcripts: true
feedback_max_bytes: 16000
expose_attempt_detail: false
timeout_seconds: 14400
# Tasks declare a 3600s agent timeout (the denominator); case_timeout is the enforced
# per-case budget. Raised from 900 to 1200: baseline max case wall ~1122s exceeded 900.
case_timeout_seconds: 1200
task_agent_timeout_seconds: 3600
max_concurrency: 8
error_rate_threshold: 0.1
verifier_timeout_seconds: 43200  # sized for 3x held-out finalize + rescore headroom (~8h + margin)
secrets:
  - MODAL_TOKEN_ID
  - MODAL_TOKEN_SECRET
  - WANDB_API_KEY
  - WANDB_BASE_URL  # self-hosted W&B (scaleai.wandb.io)

wandb:
  project: vero-tau3
  group: tau3
  log_traces: true

inference_gateway:
  upstream_api_key_env: OPENAI_API_KEY
  upstream_base_url_env: OPENAI_BASE_URL
  producer:
    allowed_models: ["${optimizer_model:-openai/gpt-5.4}"]
    max_concurrency: 8
  # See officeqa/baseline/build.yaml for the sizing rationale: the case budget is
  # the spend control, so a token cap only needs to stop a runaway. tau3 is the
  # largest set here, hence the bigger ceiling.
  evaluation:
    allowed_models: [fireworks_ai/deepseek-v4-flash]
    max_requests: 200000
    max_tokens: 4000000000  # 900 agent case-runs (300 dev + 600 validation)
    max_concurrency: 64
  # Reserved so a search-phase overspend can never starve held-out scoring.
  finalization:
    allowed_models: [fireworks_ai/deepseek-v4-flash]
    max_requests: 200000
    max_tokens: 4000000000  # 150 test cases x3 attempts + rescore headroom
    max_concurrency: 64
instruct_multifidelity: true
instruct_exhaust_budget: true

# tau3's environment runs its own LLM services — the user-simulator (inside the
# task container) and the NL-assertions grader (verifier) — which cannot reach the
# compose-internal inference gateway. Give them the real upstream directly while
# the candidate agent keeps the metered/allow-listed gateway (VERO_AGENT_INFERENCE_*).
task_services_use_upstream: true
# Harness isolation is off for tau3: its task-owned services need the real
# upstream credential, which uid isolation cannot hide from the harness env.
# Re-enable once task-service credentials are delivered off the harness env.
harness_user: null
task_environment:
  TAU2_USER_MODEL: openai/gpt-5.4-mini-2026-03-17
  TAU2_NL_ASSERTIONS_MODEL: openai/gpt-5.4-mini-2026-03-17
