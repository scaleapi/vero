name: vero/optimize-dabstep-baseline-reweighted
description: >-
  Improve a multi-step data-analysis agent on DABstep (Adyen payment files). The
  agent explores /app/data/, reads the shipped documentation, and writes the exact
  answer to /app/answer.txt; scoring is the upstream DABstep scorer (numeric
  tolerance, order-insensitive list compare, fuzzy string match), no judge model.

  DIFFICULTY-REWEIGHTED VARIANT. Same 165 cases and same clocks as the canonical
  build; only the difficulty mix differs, 44/56 easy/hard against the dataset's own
  16/84. Use this if the canonical mix leaves the seed too close to the floor to
  optimise against: proportional puts about 5 easy tasks in a 33-case development
  partition, this puts 14. The canonical config stays the default because every
  other subsample in the suite preserves its population, so reporting from this one
  means saying in the paper that we chose the difficulty.
agent_repo: target
# Harbor-native: the hub package carries the environment, so unlike officeqa and
# browsecomp-plus nothing is vendored locally. The image curls its seven data
# files at build time and needs no network at run time.
task_source: adyen/dabstep@sha256:0edf62c0bdf7003b1d1f934f1547df1c051877e076d5b6f6a2d99caf8b6432b3
task_manifest: ../partitions/reweighted/manifest.json
agent_import_path: dabstep_agent.agent:DabstepAgent
harbor_requirement: harbor[modal]==0.20.0

partition_files:
  development: ../partitions/reweighted/development.json
  validation: ../partitions/reweighted/validation.json
  test: ../partitions/reweighted/test.json

# Four full passes over each agent-visible partition, the suite convention.
agent_access:
  - partition: development
    disclosure: full
    expose_case_resources: true
    total_runs: 100
    total_cases: 132
  - partition: validation
    disclosure: aggregate
    expose_case_resources: false
    min_aggregate_cases: 5
    total_runs: 100
    total_cases: 264

selection_partition: validation
targets:
  - partition: test
    reward_key: reward
    # UNPINNED. score_baseline below is true only until a K=3 held-out pin exists.
    # Run `scripts/rescore_candidate.py --seed` three times, put the mean here,
    # and set score_baseline: false. Leaving it as-is costs one extra full
    # held-out pass per run and makes the reward irreproducible, which is exactly
    # what swe-bench-pro shipped with; do not report a number measured this way.
    failure_value: 0.0
    max_attempts: 1
    # The held-out eval is noisy: score the selected candidate 3x per case and
    # average, so the final reward is comparable to a K=3 pinned baseline.
    n_attempts: 3
    aggregate_attempts: mean

evaluation_set_name: dabstep
objective:
  selector:
    metric: score
  direction: maximize
reward_mode: submit
baseline_floor: false
score_baseline: true  # see the note on baseline_reward above; flip to false once pinned
rescore_top_k: 3
rescore_attempts: 1

model: fireworks_ai/deepseek-v4-flash
environment_name: ${inner_env:-modal}
# No --no-force-build: unlike officeqa this dataset builds its own image rather
# than pulling a prebuilt corpus, and no task sets docker_image.
extra_harbor_args: ["--ek", "app_name=harness-engineering-bench", "--ek", "sandbox_idle_timeout_secs=3600"]
harbor_python_version: "3.12"
n_attempts: 1
# Four retries with a 120s ceiling, the suite convention since a single retry
# could not survive a provider rate-limit storm: seven rejections over ten
# minutes destroyed a 37-case evaluation. This benchmark's target is the model
# currently throwing ~30% 429s, so this is load-bearing here.
max_retries: 4
retry_max_wait_seconds: 120
infrastructure_max_attempts: 3
infrastructure_retry_delay_seconds: 5
aggregate_attempts: best
feedback_transcripts: true
feedback_max_bytes: 16000
expose_attempt_detail: false
# Unreachable: worst case is ceil(198/24) x 1800 = 16200s, every finalize trial
# (66 held-out x n_attempts=3) hitting its own cap. Assumes max_concurrency=24;
# recompute this and verifier_timeout_seconds if that drops.
timeout_seconds: 18000
# Exactly the dataset's declared [agent] timeout_sec (uniform across all 450
# tasks), so vero's derived --agent-timeout-multiplier is 1.0 and the target
# agent gets precisely the clock the benchmark intends.
case_timeout_seconds: 1800
task_agent_timeout_seconds: 1800
max_concurrency: 24
# The build curls seven files from an external host. At 24 concurrent sandboxes a
# rate-limited or 404ing host trips this threshold and aborts the whole
# evaluation rather than one case, so watch the first cold build.
error_rate_threshold: 0.1
# Unreachable: worst-case finalize (16200) + worst-case rescore_top_k=3
# validation rescore (16200). A verifier timeout loses the score outright.
verifier_timeout_seconds: 36000
secrets:
  - MODAL_TOKEN_ID
  - MODAL_TOKEN_SECRET
  - WANDB_API_KEY
  - WANDB_BASE_URL

# The verifier is a local Python scorer with no judge model, so this benchmark
# needs no task-side credential and keeps the isolation officeqa and gaia have
# and tau3, browsecomp-plus and swe-atlas-qna had to give up.
harness_user: harness

agent_env:
  # Above this benchmark's widest single blocking eval: a full validation pass is
  # ceil(66/24) x 1800 = 5400s worst case. Measured mean case wall is ~170s, so
  # this is ~10x the realistic figure; the convention sizes it against the cap.
  BASH_MAX_TIMEOUT_MS: "7200000"
  BASH_DEFAULT_TIMEOUT_MS: "7200000"
  ENABLE_BACKGROUND_TASKS: "0"
  FORCE_AUTO_BACKGROUND_TASKS: "0"
  UV_TOOL_BIN_DIR: "/home/agent/.local/bin"

wandb:
  project: harness-engineering-bench
  group: dabstep
  name: ${wandb_run:-dabstep-reweighted}
  tags: [dabstep, reweighted]
  log_traces: true

inference_gateway:
  upstream_api_key_env: OPENAI_API_KEY
  upstream_base_url_env: OPENAI_BASE_URL
  request_log_attribution: true
  producer:
    allowed_models: ["${optimizer_model:-openai/gpt-5.4}"]
    max_concurrency: 8
  # Token caps are a runaway backstop, not the spend control. Sized at ~3M tokens
  # per case-run against 396 agent case-runs (132 development + 264 validation).
  evaluation:
    allowed_models: [fireworks_ai/deepseek-v4-flash]
    max_requests: 200000
    max_tokens: 2000000000
    max_concurrency: 64
  # Reserved so a search-phase overspend cannot starve held-out scoring: 198
  # finalize trials (66 test x3) plus the rescore headroom.
  finalization:
    allowed_models: [fireworks_ai/deepseek-v4-flash]
    max_requests: 200000
    max_tokens: 2000000000
    max_concurrency: 64
