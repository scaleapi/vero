name: vero/optimize-officeqa-baseline
description: >-
  Improve a grounded-reasoning agent on OfficeQA (Treasury Bulletin corpus QA).
  The agent must search /app/corpus/ and write the exact answer to /app/answer.txt;
  scoring is rule-based (numeric/text match with 1% tolerance).
# Local (vendored) dataset — OfficeQA is not in the Harbor hub, only the
# harbor-datasets git repo. task_source points at the vendored task dirs; the
# per-task task.toml carries docker_image=officeqa-corpus (full-corpus mode), so
# extra_harbor_args uses --no-force-build to pull that prebuilt image instead of
# building the guard Dockerfile.
agent_repo: target
task_source: ../tasks
task_manifest: ../partitions/manifest.json
agent_import_path: officeqa_agent.agent:OfficeQaAgent
harbor_requirement: harbor[modal]==0.20.0

partition_files:
  development: ../partitions/development.json
  validation: ../partitions/validation.json
  test: ../partitions/test.json

agent_access:
  - partition: development
    disclosure: full
    expose_case_resources: true
    total_runs: 100
    total_cases: 196
  - partition: validation
    disclosure: aggregate
    expose_case_resources: false
    min_aggregate_cases: 5
    total_runs: 100
    total_cases: 392

selection_partition: validation
targets:
  - partition: test
    reward_key: reward
    baseline_reward: 0.3412  # re-pinned 0.354 / 0.296 / 0.374 (sd 0.0330); was 0.3603. See runs/BASELINES.md
    failure_value: 0.0
    max_attempts: 1
    # The held-out eval is noisy: score the selected candidate 3x per case and
    # average, so the final reward is comparable to the K=3 pinned baseline.
    # Per-target override — search/validation keep the global n_attempts (1).
    n_attempts: 3
    aggregate_attempts: mean

evaluation_set_name: officeqa
objective:
  selector:
    metric: score
  direction: maximize
reward_mode: submit  # agent picks; falls back to auto_best, then current version
baseline_floor: false  # gates on validation while reward is on test; opt-in only
score_baseline: false
rescore_top_k: 3
rescore_attempts: 1

model: fireworks_ai/deepseek-v4-flash
environment_name: ${inner_env:-modal}
# --no-force-build pulls the prebuilt officeqa-corpus image (see task_source
# note above); the --ek groups inner sandboxes under one dedicated Modal app.
extra_harbor_args: ["--no-force-build", "--ek", "app_name=harness-engineering-bench", "--ek", "sandbox_idle_timeout_secs=3600"]
harbor_python_version: "3.12"
n_attempts: 1
# Raised from 1 on 2026-07-29. This field exists precisely so "a transient
# upstream rate-limit storm during a mandatory evaluation does not fail
# otherwise-good candidates" (see HarborBuildConfig), and it was set to the
# least aggressive value. Measured that night: the shared Fireworks per-minute
# bucket rejected 78,748 requests across one officeqa pass, sustaining
# ~900-1,000/min for 24 minutes, and SEVEN rejections spread over ten minutes
# were enough to destroy a 37-case evaluation. The retry stack during search is
# only the target agent's own SDK (max_retries=8, ~1 min of jittered backoff,
# and candidate-controlled so it cannot be relied on) plus this one; the
# infrastructure_max_attempts retry below applies to trusted finalization only.
# 4 retries at multiplier 2 from a 4s floor, capped at 120s, gives roughly four
# more minutes of ride-out per case. That covers the bursts, though not a
# 24-minute saturation -- for which the answer is fewer concurrent runs or a
# larger provider quota, not more retrying.
max_retries: 4
retry_max_wait_seconds: 120
infrastructure_max_attempts: 3
infrastructure_retry_delay_seconds: 5
aggregate_attempts: best
feedback_transcripts: true
feedback_max_bytes: 16000
expose_attempt_detail: false
# Unreachable: worst case is ceil(297/24) x 1800 = 23400s, every
# finalize trial (99 held-out x n_attempts=3) hitting its own cap. Assumes
# max_concurrency=24; recompute if that drops.
timeout_seconds: 28800
# Exactly the dataset's declared [agent] timeout_sec, so vero's derived
# --agent-timeout-multiplier is 1.0 and the target agent gets precisely the
# clock the benchmark intends. Harbor times agent setup, environment build and
# verification on separate clocks with separate multipliers, so none of them
# eat into this budget and no buffer is warranted.
case_timeout_seconds: 1800
task_agent_timeout_seconds: 1800
# Raised 8 -> 24 to cut finalize wall time ~3x (297 trials / concurrency x the
# ~400s measured mean case wall: ~4.1h at 8, ~1.4h at 24 -- the mean, not the
# 1800s cap above). Derived headroom: run #2 sustained 16 case slots
# (2 detached evals x 8) at ~181k metered TPM/slot with upstream_errors=0, so 24
# slots is ~1.5x a proven configuration. Watch upstream_errors in
# artifacts/inference/usage.json; if it stays 0, there is room to go further.
max_concurrency: 24
error_rate_threshold: 0.1
# Unreachable: worst-case finalize (23400) + worst-case rescore_top_k=3
# validation rescore (23400). A verifier timeout loses the score outright.
verifier_timeout_seconds: 54000
secrets:
  - MODAL_TOKEN_ID
  - MODAL_TOKEN_SECRET
  - WANDB_API_KEY
  - WANDB_BASE_URL  # self-hosted or cloud W&B

# candidate harness runs as an unprivileged uid, unable to read held-out state.
harness_user: harness

# Optimizer-agent env (forwarded to the harbor claude-code agent as --ae KEY=VALUE).
# Inner evals take 15-30 min; Claude Code's Bash tool caps a single call at
# BASH_MAX_TIMEOUT_MS (default 600000=10min), which forced the agent into
# --detach + background-poll + end-turn (it then ended its turn waiting for a
# notification that never re-wakes a headless --print run). Raise the cap so the
# agent can block on a whole eval in one Bash call.
# The background-task vars are kept for defence in depth but do NOT actually
# disable the Bash tool's run_in_background parameter -- the model can still
# choose it, and run #2 did. The instruction is what forbids it.
agent_env:
  # Above this benchmark's widest single eval: a full validation pass is
  # ceil(98/24) x 1800 = 9000s worst case.
  BASH_MAX_TIMEOUT_MS: "10800000"
  BASH_DEFAULT_TIMEOUT_MS: "10800000"  # same as max: an un-timed eval must still block
  ENABLE_BACKGROUND_TASKS: "0"         # gates auto-backgrounding only (see above)
  FORCE_AUTO_BACKGROUND_TASKS: "0"
  # Harnesses installed with `uv tool install` (mini-swe-agent, swe-agent)
  # default to symlinking their entry point into /usr/local/bin, which the
  # unprivileged optimizer user cannot write: "Failed to install executable
  # ... Permission denied". npm/nvm-based harnesses (claude-code, opencode)
  # are unaffected, so this only bites when the harness changes.
  UV_TOOL_BIN_DIR: "/home/agent/.local/bin"

wandb:
  project: harness-engineering-bench
  entity: egp  # the shared team org, NOT the launching user's default
  group: officeqa  # keeps the benchmark distinguishable in the shared project
  name: ${wandb_run:-officeqa}  # per-launch label, e.g. --param wandb_run=officeqa__claude-sonnet-5
  tags: [officeqa]
  log_traces: true

inference_gateway:
  upstream_api_key_env: OPENAI_API_KEY
  upstream_base_url_env: OPENAI_BASE_URL
  # Stamp request-log records with a thread_id so per_trial_tokens.py can attribute
  # gateway token usage to individual trials (trusted, vs. content-matching).
  request_log_attribution: true
  producer:
    allowed_models: ["${optimizer_model:-openai/gpt-5.4}"]
    max_concurrency: 8
  # Token caps are a runaway backstop, not the spend control: the work is already
  # bounded by the agent case budget above and by the fixed held-out set, so a cap
  # that bites first only aborts authorized work. Sized at ~3M tokens per
  # case-run, ~2.3x the worst measured cost (1.33M/case for an optimized
  # candidate). ~90% of these tokens are cache reads, counted at full weight.
  evaluation:
    allowed_models: [fireworks_ai/deepseek-v4-flash]
    max_requests: 200000
    max_tokens: 3000000000  # 588 agent case-runs (196 dev + 392 validation)
    max_concurrency: 64
  # Reserved so a search-phase overspend can never starve held-out scoring. This
  # inherited evaluation's 100M, exhausted mid-finalize, and shipped reward 0.0.
  finalization:
    allowed_models: [fireworks_ai/deepseek-v4-flash]
    max_requests: 200000
    max_tokens: 3000000000  # 297 finalize trials (99 test x3) + 294 rescore
    max_concurrency: 64
