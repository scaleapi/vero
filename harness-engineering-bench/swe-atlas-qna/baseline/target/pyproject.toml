[project]
name = "vero-swe-atlas-qna-agent"
version = "0.1.0"
description = "Editable Harbor-native SWE-Atlas-QnA baseline for VeRO"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.20.0",
    "openai==2.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agent"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
