name: vero/optimize-swe-atlas-qna-baseline
description: >-
  Improve a codebase investigation agent on canonical SWE-Atlas-QnA tasks.
  The target must inspect /app without modifying it and write a comprehensive,
  evidence-backed answer to /logs/agent/answer.txt.
agent_repo: target
task_source: scale-ai/swe-atlas-qna@sha256:0e26bc0313ae2fc6f912b67b928e648c7f20d17d91f765f702a93042ce5be0e4
task_manifest: ../partitions/manifest.json
agent_import_path: atlas_agent.agent:AtlasAgent
harbor_requirement: harbor[modal]==0.20.0

partition_files:
  development: ../partitions/development.json
  validation: ../partitions/validation.json
  test: ../partitions/test.json

agent_access:
  - partition: development
    disclosure: full
    expose_case_resources: true
    total_runs: 12
    total_cases: 100
  - partition: validation
    disclosure: aggregate
    expose_case_resources: false
    min_aggregate_cases: 5
    total_runs: 8
    total_cases: 196

selection_partition: validation
targets:
  - partition: test
    reward_key: reward
    failure_value: 0.0
    max_attempts: 1

evaluation_set_name: swe-atlas-qna
objective:
  selector:
    metric: score
  direction: maximize
reward_mode: submit  # agent picks; falls back to auto_best, then current version
baseline_floor: true  # only guards the no-submission fallback path
score_baseline: true
rescore_top_k: 3
rescore_attempts: 1

# gpt-5.4-mini-2026-03-17 is NOT provisioned on the configured Azure resource:
# every eval- and finalization-scope call returned 404 DeploymentNotFound, so the
# candidate agent made no progress and each case that survived infrastructure was
# scored 0.0 as a task failure. gpt-4o and gpt-5.3-codex are the only deployments
# that answer today. Restore this to a reasoning model once one is provisioned.
model: openai/gpt-4o
environment_name: modal
# inner eval sandboxes share a dedicated Modal app instead of the __harbor__ default.
# modal_vm_runtime replaces the DinD strategy, whose single host-networked gRPC
# stream is a per-sandbox SPOF: 320 of 469 cases were lost to it as sandbox
# NotFoundError / AddTestsDirError / RuntimeError.
extra_harbor_args: ["--ek", "app_name=harness-engineering-bench", "--ek", "sandbox_idle_timeout_secs=3600", "--ek", "modal_vm_runtime=true"]
harbor_python_version: "3.12"
n_attempts: 1
max_retries: 1
infrastructure_max_attempts: 3
infrastructure_retry_delay_seconds: 5
aggregate_attempts: best
feedback_transcripts: true
feedback_max_bytes: 16000
expose_attempt_detail: false
timeout_seconds: 14400
max_concurrency: 8
error_rate_threshold: 0.1
verifier_timeout_seconds: 14400
secrets:
  - MODAL_TOKEN_ID
  - MODAL_TOKEN_SECRET
  - WANDB_API_KEY
  - WANDB_BASE_URL  # self-hosted W&B (scaleai.wandb.io)

wandb:
  project: vero-swe-atlas-qna
  group: swe-atlas-qna
  log_traces: true

inference_gateway:
  upstream_api_key_env: OPENAI_API_KEY
  upstream_base_url_env: OPENAI_BASE_URL
  producer:
    allowed_models: ["${optimizer_model:-gpt-5.4}"]
    max_concurrency: 8
  evaluation:
    # Must stay in lockstep with `model` above, or the gateway 403s instead.
    allowed_models: [gpt-4o]
    max_requests: 15000
    max_tokens: 100000000
    max_concurrency: 64
instruct_multifidelity: true
instruct_exhaust_budget: true
# The rubric judge runs inside the Modal task container and cannot reach the
# compose-internal gateway; it gets the real upstream on OPENAI_* while the
# candidate agent keeps the metered gateway on VERO_AGENT_INFERENCE_*.
task_services_use_upstream: true
# ACCEPTED EXPOSURE (non-adversarial optimizer): with isolation off, candidate
# harness code shares the sidecar uid, so it could read the upstream key and
# the held-out session state. Runs using this config get a post-run leakage
# audit of every candidate version. Proper fix: per-role egress isolation.
harness_user: null
