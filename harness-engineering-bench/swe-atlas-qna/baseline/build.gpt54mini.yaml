name: vero/optimize-swe-atlas-qna-baseline
description: >-
  Improve a codebase investigation agent on canonical SWE-Atlas-QnA tasks.
  The target must inspect /app without modifying it and write a comprehensive,
  evidence-backed answer to /logs/agent/answer.txt.
agent_repo: target
task_source: scale-ai/swe-atlas-qna@sha256:0e26bc0313ae2fc6f912b67b928e648c7f20d17d91f765f702a93042ce5be0e4
task_manifest: ../partitions/manifest.json
agent_import_path: atlas_agent.agent:AtlasAgent
harbor_requirement: harbor[modal]==0.20.0

partition_files:
  development: ../partitions/development.json
  validation: ../partitions/validation.json
  test: ../partitions/test.json

agent_access:
  - partition: development
    disclosure: full
    expose_case_resources: true
    total_runs: 100
    total_cases: 100
  - partition: validation
    disclosure: aggregate
    expose_case_resources: false
    min_aggregate_cases: 5
    total_runs: 100
    total_cases: 196

selection_partition: validation
targets:
  - partition: test
    reward_key: reward
    # Measured on THIS target model, not inherited: build.yaml's floor was
    # measured on fireworks_ai/gpt-oss-120b and says nothing about gpt-5.4-mini
    # -- a delta against it would be a model comparison dressed up as an
    # optimization result. Pinned via
    #   rescore_candidate.py --seed --benchmark swe-atlas-qna --model gpt-5.4-mini
    # (the same path that produced every other pinned baseline).
    #
    # Convention: trials the SEED killed score 0 (12 RuntimeError, the seed's
    # empty-completion fail-fast at ~8% -- harness headroom an optimizer can
    # fix, and finalization zero-fills a candidate's dead attempts the same
    # way); trials the PLATFORM killed are dropped (1 RateLimitError,
    # 1 VerifierTimeoutError -- zero-filling infra bakes outage luck into the
    # floor). See runs/recompute.py for the classification.
    baseline_reward: 0.1216  # K=3: 0.100 / 0.122 / 0.143 (sd 0.0175, n=148). See runs/BASELINES.md
    failure_value: 0.0
    max_attempts: 1
    # The held-out eval is noisy: score the selected candidate 3x per case and
    # average, so the final reward is comparable to the pinned baseline, which was
    # itself pooled over 3 rounds. Without this the candidate carries ~sqrt(3) more
    # standard error than the floor it is judged against.
    # Per-target override - search/validation keep the global n_attempts (1).
    n_attempts: 3
    aggregate_attempts: mean

evaluation_set_name: swe-atlas-qna
objective:
  selector:
    metric: score
  direction: maximize
reward_mode: submit  # agent picks; falls back to auto_best, then current version
baseline_floor: false  # gates on validation while reward is on test; opt-in only
score_baseline: false  # seed floor pinned above; don't re-score it every run
rescore_top_k: 3
rescore_attempts: 1

model: gpt-5.4-mini
environment_name: ${inner_env:-modal}
# inner eval sandboxes share a dedicated Modal app instead of the __harbor__ default.
# keepalive: these images set ENTRYPOINT ["/bin/bash"], which Modal prepends to the
# sandbox command; harbor's default keepalive ["sh","-c","sleep infinity"] then dies
# instantly (bash interprets the sh binary as a script) and every trial fails with
# "Sandbox already shut down". Passing bash's own args keeps the sandbox alive.
extra_harbor_args: ["--ek", "app_name=harness-engineering-bench", "--ek", "sandbox_idle_timeout_secs=3600", "--ek", 'keepalive=["-c","sleep infinity"]']
# Concurrent cells each `npm install -g` their harness at once, which saturates the
# link: harbor's agent-setup budget is 360s and FOUR of five cells died on it on
# 2026-07-30 (AgentSetupTimeoutError at 360.0s, mid `npm install -g
# @anthropic-ai/claude-code` / the claude-code bootstrap curl), across all four
# harnesses and all five models. A single atlas cell run alone survives, which is
# why the smoke never caught it. x4 gives 24 minutes to get installed.
# This is the OUTER trial's budget, hence optimizer_harbor_args and not
# extra_harbor_args (which tunes the nested eval). Setup budget only: agent
# execution, case and verifier timeouts are untouched, so measured scores stay
# comparable. swe-bench-pro's grid config has carried this since 07-29; atlas was
# simply never given it.
optimizer_harbor_args: ["--agent-setup-timeout-multiplier", "4"]
harbor_python_version: "3.12"
n_attempts: 1
# Retries are kept at the sibling value but are near-idle on this target:
# gpt-5.4-mini resolves to azure_ai/gpt-5.4-mini, NOT the fireworks pool, and
# gaia has run 51 rounds against it at a 0.5% upstream error rate versus 47%
# for gpt-oss-120b on 2026-07-30. Original gpt-oss rationale, kept for history:
# the old target was fireworks_ai/gpt-oss-120b, on the SAME org-wide
# fireworks quota that swe-bench-pro measured as bursty (429 on 11 of 12
# sequential calls, then 1 of 4 a minute later). That is a provider-level limit,
# not this key's, so it cannot be tuned away from here and has to be ridden out.
# swe-bench-pro went 1 -> 5 after a single retry proved insufficient there; atlas
# was left at 1. Retries only cover infrastructure/rate-limit errors, so this does
# not change any measured score.
max_retries: 5
infrastructure_max_attempts: 3
# 20 -> 5, matching every sibling (gaia, officeqa, tau3, browsecomp-plus,
# swe-bench-pro all pin 5). 20 was this file's own invention and it is pure dead
# wall clock on a 429-heavy path: the live 2026-07-30 sonnet5 run logged 6713
# rate-limit rejections out of 13697 gateway calls, so a 4x longer backoff is a
# 4x longer wait on roughly half of all traffic. The attempt budget stays at 5
# (still 5x the siblings' 1), so success probability is unchanged in kind; only
# the gap between attempts shrinks, and these rejections are bursty rather than
# sustained. Retries only cover infrastructure/rate-limit errors, so no measured
# score moves.
infrastructure_retry_delay_seconds: 5
aggregate_attempts: best
feedback_transcripts: true
feedback_max_bytes: 16000
expose_attempt_detail: false
# Unreachable: worst case is ceil(150/24) x 10800 = 75600s, every
# finalize trial (50 held-out x n_attempts=3) hitting its own cap. Assumes
# max_concurrency=24; recompute if that drops.
timeout_seconds: 90000
# Exactly the dataset's declared [agent] timeout_sec, so vero's derived
# --agent-timeout-multiplier is 1.0 and the target agent gets precisely the
# clock the benchmark intends. Harbor times agent setup, environment build and
# verification on separate clocks with separate multipliers, so none of them
# eat into this budget and no buffer is warranted.
case_timeout_seconds: 10800
task_agent_timeout_seconds: 10800
max_concurrency: 24  # 8 -> 24; see officeqa for the measured headroom argument
error_rate_threshold: 0.1
# Unreachable: worst-case finalize (75600) + worst-case rescore_top_k=3
# validation rescore (75600). A verifier timeout loses the score outright.
verifier_timeout_seconds: 176400
secrets:
  - MODAL_TOKEN_ID
  - MODAL_TOKEN_SECRET
  - WANDB_API_KEY
  - WANDB_BASE_URL  # self-hosted or cloud W&B

wandb:
  project: harness-engineering-bench  # one project for the whole suite
  group: swe-atlas-qna  # keeps the benchmark distinguishable in the shared project
  name: ${wandb_run:-swe-atlas-qna}  # per-launch label, e.g. --param wandb_run=swe-atlas-qna__claude-sonnet-5
  tags: [swe-atlas-qna]
  log_traces: true

inference_gateway:
  upstream_api_key_env: OPENAI_API_KEY
  upstream_base_url_env: OPENAI_BASE_URL
  # Stamp request-log records with a thread_id so per_trial_tokens.py can attribute
  # gateway token usage to individual trials (trusted, vs. content-matching).
  # Without it the fallback recovers only each conversation's root turn: measured
  # 0-13% coverage unstamped against 90-98% stamped, even with --tasks-dir.
  # Matches origin/main's build.yaml (aff0419); needed here because the point of
  # this run is a per-case cost number for the mini-vs-nano decision.
  request_log_attribution: true
  producer:
    # BOTH spellings, prefixed and bare. The gateway compares the requested model
    # against this list as an exact string (gateway/inference.py: `model not in
    # scope.allowed_models`), and the agent harnesses strip the provider prefix
    # before calling it. With only the prefixed form here, every openai- and
    # anthropic-routed optimizer gets a 403 "model is not allowed for this scope"
    # on its very first call. swe-bench-pro's grid config already carries both
    # after that cost a whole run; this one still had a single entry.
    # A third entry for the harness's auxiliary model. opencode issues one
    # summarisation/title call per session on a small model of the same provider
    # family, and it sends the DATED id: the live 2026-07-30 sonnet5 run logged
    # exactly one `claude-haiku-4-5-20251001` producer request and it came back
    # 403 model_denied, while all 190 `claude-sonnet-5` calls passed. Non-fatal
    # (1 call in 191) and not a speed lever, but it is invisible outside the
    # gateway request log. CONFIGURATION.md names the bare `claude-haiku-4-5` /
    # `gpt-5.4-nano`; the gateway compares exact strings, so the dated spelling
    # that actually goes on the wire is what has to be here. Parameterised
    # because the name varies by provider family.
    allowed_models:
      - "${optimizer_model:-openai/gpt-5.4}"
      - "${optimizer_model_bare:-gpt-5.4}"
      - "${optimizer_aux_model:-gpt-5.4-nano}"
    max_concurrency: 8
  # See officeqa/baseline/build.yaml for the sizing rationale: the case budget is
  # the spend control, so a token cap only needs to stop a runaway.
  evaluation:
    allowed_models: [gpt-5.4-mini]
    max_requests: 200000
    max_tokens: 2000000000  # 296 agent case-runs (100 dev + 196 validation)
    max_concurrency: 64
  # Reserved so a search-phase overspend can never starve held-out scoring.
  finalization:
    allowed_models: [gpt-5.4-mini]
    max_requests: 200000
    max_tokens: 2000000000  # 50 test cases x3 attempts + rescore headroom
    max_concurrency: 64
instruct_multifidelity: true
instruct_exhaust_budget: true
# The rubric judge runs inside the Modal task container and cannot reach the
# compose-internal gateway; it gets the real upstream on OPENAI_* while the
# candidate agent keeps the metered gateway on VERO_AGENT_INFERENCE_*.
task_services_use_upstream: true
# ACCEPTED EXPOSURE (non-adversarial optimizer): with isolation off, candidate
# harness code shares the sidecar uid, so it could read the upstream key and
# the held-out session state. Runs using this config get a post-run leakage
# audit of every candidate version. Proper fix: per-role egress isolation.
harness_user: null
# Optimizer-agent env (forwarded to the harbor claude-code agent as --ae KEY=VALUE).
# This block used to raise BASH_MAX_TIMEOUT_MS/BASH_DEFAULT_TIMEOUT_MS to hours so
# a whole eval fit in one blocking Bash call: the 10-minute default had pushed the
# officeqa optimizer into --detach + background-poll + end-turn, and a headless
# --print run is never re-woken, so the search died there. A real trade, and it
# bought the opposite failure. Harbor reads the optimizer through one long-lived
# stdout stream, and a harness flushes a command's output only when the command
# returns, so an hours-long call is an hours-long silence and the idle stream gets
# reaped: a swe-atlas-qna cell died that way at 71 minutes on 2026-07-31, 9m57s
# into one wait, discarding a candidate already scored 0.1224.
# Neither cap belongs here now. `evals run` returns inside its own bound carrying a
# job_id to wait on again, so the optimizer is never forced to detach and end its
# turn, and vero sets the tool-call cap itself (HARNESS_TOOL_TIMEOUT_SECONDS in
# vero/harbor/cli.py). Setting either variable here would silently switch that off:
# harbor keeps the last value for a key and this block is applied after vero's.
# The background-task vars are defence in depth only: they gate *automatic*
# backgrounding and do NOT remove the Bash tool's run_in_background parameter,
# which the model can still choose. The instruction forbids that.
agent_env:
  ENABLE_BACKGROUND_TASKS: "0"
  FORCE_AUTO_BACKGROUND_TASKS: "0"
  # Harnesses installed with `uv tool install` (mini-swe-agent, swe-agent)
  # default to symlinking their entry point into /usr/local/bin, which the
  # unprivileged optimizer user cannot write: "Failed to install executable
  # ... Permission denied". npm/nvm-based harnesses (claude-code, opencode)
  # are unaffected, so this only bites when the harness changes.
  UV_TOOL_BIN_DIR: "/home/agent/.local/bin"

