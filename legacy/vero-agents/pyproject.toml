[tool.ruff]
# Target Python 3.11 (matches requires-python in sub-projects)
target-version = "py311"
line-length = 120

# Exclude common non-source directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "wandb",
    "data",
]

[tool.ruff.lint]
# Enable recommended rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF001", # ambiguous unicode (intentional in prompts/display strings)
    "RUF005", # [*list, item] vs list + [item] - style preference
    "RUF013", # implicit Optional - style preference
    "RUF015", # next(iter()) vs list()[0] - style preference
    "C408",   # dict() vs {} - style preference
    "C416",   # list comprehension vs list() - style preference
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports are re-exports

[tool.ruff.lint.isort]
known-first-party = [
    "generic_agent",
    "web_search_agent",
    "pharma_summarizer",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
