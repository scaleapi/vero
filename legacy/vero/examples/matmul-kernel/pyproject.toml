[project]
name = "matmul-kernel"
version = "0.1.0"
description = "A naive matrix multiply kernel — optimize it with vero"
requires-python = ">=3.11"
dependencies = ["scale-vero"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matmul_kernel"]

[tool.uv.sources]
scale-vero = { path = "../../", editable = true }
