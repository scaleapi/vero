[project]
name = "vero-conformance-agent"
version = "0.1.0"
description = "Trivial editable target harness for the VeRO conformance example"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.20.0",
    "openai==2.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformance_agent"]
