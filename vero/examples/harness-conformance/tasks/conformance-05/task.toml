version = "1.0"

[task]
name = "conformance/conformance-05"

[metadata]
author_name = "VeRO"
benchmark = "harness-conformance"
source = "vero-examples"
source_id = "conformance-05"
difficulty = "trivial"
category = "smoke"
tags = ["conformance", "smoke"]

# Deliberately tight: this task is seconds of work, so a hang is obvious rather
# than something that quietly eats an hour. vero sets case_timeout_seconds to
# match [agent] exactly, making harbor's agent-timeout multiplier 1.0.
[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
allow_internet = true
