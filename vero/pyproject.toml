[project]
name = "scale-vero"
version = "0.5.0"
description = "A harness for agents to optimize programs."
readme = "README.md"
authors = [
    { name = "Varun Ursekar", email = "oss@scale.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.11.7",
    "wcmatch>=10.1",
]

[project.scripts]
vero = "vero.cli:main"

[project.optional-dependencies]
harbor = [
    "fastapi>=0.110",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.2",
    "uvicorn>=0.27",
]
claude = [
    "claude-agent-sdk>=0.1.56",
]
optimize = [
    "async-lru>=2.0.5",
    "beautifulsoup4>=4.14.2",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "openai-agents[litellm]>=0.13.4,<0.14",
    "pypdf>=6.2.0",
    "trafilatura>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vero"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
name = "pypi"

[tool.uv.sources]
vero = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "gitpython>=3.1.46",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-json-report>=1.5.0",
    "scale-vero[optimize,harbor,claude]",
]
